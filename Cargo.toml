[package]
name = "lethe"
version = "0.1.0"
edition = "2021"
description = "Hand a Claude Code session's work to the next one across /clear"

[[bin]]
name = "lethe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
# Keeps settings.json's keys in their order when it's written back.
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[profile.release]
strip = true
lto = "thin"
